<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オンライン 2Dミニカート</title>
    <!-- オンライン通信用のライブラリを読み込み -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            margin: 0; background-color: #2c3e50; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; color: white;
            font-family: sans-serif; overflow: hidden;
        }
        h2 { margin: 5px 0; font-size: 1.2rem; }
        canvas {
            background-color: #27ae60; border: 5px solid #ecf0f1; border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); max-width: 95%; max-height: 55vh;
        }
        #controls {
            display: flex; width: 100%; max-width: 800px; justify-content: space-between;
            align-items: flex-end; padding: 15px; box-sizing: border-box; user-select: none;
        }
        .control-group { display: flex; gap: 15px; }
        .control-group.column { flex-direction: column; align-items: center; gap: 5px; }
        .btn {
            background-color: rgba(255, 255, 255, 0.2); border: 2px solid white; color: white;
            font-size: 24px; font-weight: bold; width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            user-select: none; touch-action: none;
        }
        .btn:active, .btn.active { background-color: rgba(255, 255, 255, 0.6); color: #2c3e50; }
        #btn-item {
            width: 80px; height: 80px; font-size: 30px; background-color: rgba(243, 156, 18, 0.8);
            border: 3px solid #f1c40f; border-radius: 15px;
        }
        #btn-item:active, #btn-item.active { background-color: rgba(241, 196, 15, 1); }
        #status { color: #f1c40f; font-size: 0.9rem; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h2>オンライン 2Dミニカート</h2>
    <div id="status">通信サーバーに接続中...</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="controls">
        <div class="control-group">
            <div class="btn" id="btn-left">←</div>
            <div class="btn" id="btn-right">→</div>
        </div>
        <div class="control-group">
            <div class="btn" id="btn-item">❓</div>
        </div>
        <div class="control-group column">
            <div class="btn" id="btn-up">↑</div>
            <div class="btn" id="btn-down">↓</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const keys = {};

        // 自分のIDとカラーをランダムに決定
        const myId = 'player_' + Math.random().toString(36).substr(2, 9);
        const myColor = `hsl(${Math.random() * 360}, 80%, 55%)`; // 他のプレイヤーと区別するため

        // 他のプレイヤーの情報を保存する場所
        const otherPlayers = {};

        // --- オンライン通信の設定 ---
        const statusEl = document.getElementById('status');
        const roomTopic = 'my-mariokart-room-9999'; // この合言葉で同じ部屋に入る
        
        // パブリックの通信サーバーに接続
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => {
            statusEl.innerText = 'オンライン接続完了！友達を呼ぼう！';
            client.subscribe(roomTopic); // 部屋に参加
        });

        client.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());
            
            // 自分が送ったデータ以外を受信
            if (data.id !== myId) {
                if (data.type === 'move') {
                    otherPlayers[data.id] = {
                        x: data.x, y: data.y, angle: data.angle, color: data.color,
                        lastUpdate: Date.now() // 切断判定用
                    };
                } else if (data.type === 'banana') {
                    // 誰かがバナナを置いた
                    bananas.push({ x: data.x, y: data.y });
                }
            }
        });

        // 自分の位置を定期的にサーバーへ送信（1秒間に10回）
        setInterval(() => {
            if (client.connected) {
                client.publish(roomTopic, JSON.stringify({
                    type: 'move', id: myId, x: kart.x, y: kart.y, angle: kart.angle, color: myColor
                }));
            }
        }, 100);
        // ------------------------------

        // ボタンとキーの処理
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function bindButton(id, keyName) {
            const btn = document.getElementById(id);
            const press = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); };
            const release = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); };
            btn.addEventListener('touchstart', press); btn.addEventListener('touchend', release);
            btn.addEventListener('mousedown', press); btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }

        bindButton('btn-up', 'ArrowUp'); bindButton('btn-down', 'ArrowDown');
        bindButton('btn-left', 'ArrowLeft'); bindButton('btn-right', 'ArrowRight');
        bindButton('btn-item', ' ');

        const kart = {
            x: 400, y: 500, width: 24, length: 40, speed: 0, angle: -Math.PI / 2,
            baseMaxSpeed: 8, baseAcc: 0.2, friction: 0.96, rotationSpeed: 0.06
        };

        let currentItem = null;
        let itemPressed = false;
        let boostTimer = 0;
        let spinTimer = 0;

        const itemBoxes = [
            { x: 400, y: 120, active: true, timer: 0 },
            { x: 400, y: 480, active: true, timer: 0 }
        ];
        const bananas = [];

        function updateItemUI() {
            const btn = document.getElementById('btn-item');
            if (currentItem === 'mushroom') btn.innerText = '🍄';
            else if (currentItem === 'banana') btn.innerText = '🍌';
            else btn.innerText = '❓';
        }

        function useItem() {
            if (currentItem === 'mushroom') {
                boostTimer = 60;
            } else if (currentItem === 'banana') {
                const bx = kart.x - Math.cos(kart.angle) * 30;
                const by = kart.y - Math.sin(kart.angle) * 30;
                bananas.push({ x: bx, y: by });
                
                // バナナを置いたことを全員に送信
                if(client.connected) {
                    client.publish(roomTopic, JSON.stringify({ type: 'banana', id: myId, x: bx, y: by }));
                }
            }
            currentItem = null;
            updateItemUI();
        }

        function getDistance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

        function update() {
            if (keys[' '] && currentItem && !itemPressed) {
                useItem(); itemPressed = true;
            } else if (!keys[' ']) {
                itemPressed = false;
            }

            if (spinTimer > 0) {
                spinTimer--; kart.angle += 0.3; kart.speed *= 0.85;
            } else {
                let maxSpeed = boostTimer > 0 ? kart.baseMaxSpeed * 1.5 : kart.baseMaxSpeed;
                let acc = boostTimer > 0 ? kart.baseAcc * 2 : kart.baseAcc;
                if (boostTimer > 0) boostTimer--;

                if (keys['ArrowUp'] || keys['Up']) kart.speed += acc;
                if (keys['ArrowDown'] || keys['Down']) kart.speed -= acc;

                if (kart.speed > maxSpeed) kart.speed = maxSpeed;
                if (kart.speed < -maxSpeed / 2) kart.speed = -maxSpeed / 2;
                kart.speed *= kart.friction;

                if (Math.abs(kart.speed) > 0.1) {
                    let direction = kart.speed > 0 ? 1 : -1;
                    if (keys['ArrowLeft'] || keys['Left']) kart.angle -= kart.rotationSpeed * direction;
                    if (keys['ArrowRight'] || keys['Right']) kart.angle += kart.rotationSpeed * direction;
                }
            }

            kart.x += Math.cos(kart.angle) * kart.speed;
            kart.y += Math.sin(kart.angle) * kart.speed;

            if (kart.x < 0) kart.x = canvas.width;
            if (kart.x > canvas.width) kart.x = 0;
            if (kart.y < 0) kart.y = canvas.height;
            if (kart.y > canvas.height) kart.y = 0;

            itemBoxes.forEach(box => {
                if (!box.active) {
                    box.timer--;
                    if (box.timer <= 0) box.active = true;
                } else {
                    if (getDistance(kart.x, kart.y, box.x, box.y) < 25) {
                        box.active = false; box.timer = 180;
                        if (!currentItem) {
                            currentItem = Math.random() < 0.5 ? 'mushroom' : 'banana';
                            updateItemUI();
                        }
                    }
                }
            });

            for (let i = bananas.length - 1; i >= 0; i--) {
                if (getDistance(kart.x, kart.y, bananas[i].x, bananas[i].y) < 20) {
                    spinTimer = 45; bananas.splice(i, 1);
                }
            }

            // 古いプレイヤーデータ（2秒以上通信がない＝切断）を削除
            const now = Date.now();
            for (let id in otherPlayers) {
                if (now - otherPlayers[id].lastUpdate > 2000) {
                    delete otherPlayers[id];
                }
            }
        }

        // カートを描画する共通関数
        function drawKart(x, y, angle, color, isMe) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // 自分のカートだけダッシュの炎を描画
            if (isMe && boostTimer > 0) {
                ctx.fillStyle = '#e67e22';
                ctx.beginPath();
                ctx.moveTo(-20, -5); ctx.lineTo(-35 - Math.random() * 10, 0); ctx.lineTo(-20, 5);
                ctx.fill();
            }

            ctx.fillStyle = color;
            ctx.fillRect(-20, -12, 40, 24); // ボディ
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(10, -12, 10, 24); // フロント
            
            ctx.fillStyle = 'black';
            ctx.fillRect(-15, -16, 10, 4); ctx.fillRect(5, -16, 10, 4); // 左タイヤ
            ctx.fillRect(-15, 12, 10, 4); ctx.fillRect(5, 12, 10, 4);   // 右タイヤ
            
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // コース
            ctx.lineWidth = 120; ctx.strokeStyle = '#7f8c8d';
            ctx.beginPath(); ctx.ellipse(400, 300, 280, 180, 0, 0, Math.PI * 2); ctx.stroke();
            
            // スタートライン
            ctx.lineWidth = 10; ctx.strokeStyle = 'white';
            ctx.beginPath(); ctx.moveTo(340, 480); ctx.lineTo(460, 480); ctx.stroke();

            // アイテムボックス
            itemBoxes.forEach(box => {
                if (box.active) {
                    ctx.fillStyle = Date.now() % 400 < 200 ? '#f1c40f' : '#e74c3c';
                    ctx.fillRect(box.x - 12, box.y - 12, 24, 24);
                    ctx.fillStyle = 'white'; ctx.font = '16px bold sans-serif';
                    ctx.fillText('?', box.x - 5, box.y + 5);
                }
            });

            // バナナ
            bananas.forEach(banana => {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath(); ctx.arc(banana.x, banana.y, 8, 0, Math.PI * 2); ctx.fill();
            });

            // 他のプレイヤーを描画
            for (let id in otherPlayers) {
                const p = otherPlayers[id];
                drawKart(p.x, p.y, p.angle, p.color, false);
            }

            // 自分のカートを描画
            drawKart(kart.x, kart.y, kart.angle, myColor, true);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
